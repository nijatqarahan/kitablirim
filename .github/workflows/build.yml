name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir app && unzip -q proje.zip -d app
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: cd app && npm install
      - run: cd app && npx cap add android
      - run: cd app && npx cap sync android
      - run: cd app/android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kitapxana-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
